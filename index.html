<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <title>Harsh Shah — personal index</title>
    <meta
      name="description"
      content="Portfolio, writing, and everywhere else Harsh Shah exists online, filed in one place."
    />
    <meta name="theme-color" content="#f3efe7" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("harsh-shah:theme");
          const dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute("content", "#171410");
          }
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Harsh Shah — personal index" />
    <meta
